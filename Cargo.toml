[package]
name = "sift"
version = "0.1.0"
edition = "2024"

[workspace]
members=["astgen"]

[dependencies]
bitflags = "2.13.1"
icu_properties = "2.2.0"
num-bigint = "0.5.1"
num-traits = "0.2.19"
rowan = "0.16.1"
ryu-js = "1.0.3"

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
astgen = { path = "./astgen" }
